name: build-and-release

on:
  # 手动触发：可选是否发布到 Release
  workflow_dispatch:
    inputs:
      publish:
        description: '是否发布到 GitHub Releases'
        type: boolean
        required: false
        default: false
  # 打 v* tag 时：自动打包并发布到 Release
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 允许创建 Release 和上传资产

jobs:
  build:
    name: 打包 ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            script: pack:mac
            artifact: mac-packages
            glob: |
              dist/*.dmg
          - platform: windows
            os: windows-latest
            script: pack:win
            artifact: win-packages
            glob: |
              dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 打包
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传产物（临时）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    name: 发布到 GitHub Releases
    needs: build
    # 仅在打 tag 时、或手动触发且勾选发布时运行
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: 列出产物
        run: ls -lh packages/

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
